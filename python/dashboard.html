<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>DataFlux</title>
    <style>
        body { font-family: Arial; background: #1e1e1e; color: #fff; padding: 40px; }
        h1   { color: #00d4ff; }
        .card { background: #2d2d2d; padding: 20px; margin: 10px 0; border-radius: 8px; font-size: 1.4em; }
        .label { color: #888; font-size: 0.7em; }
    </style>
</head>
<body>
    <h1>DataFlux - Live Machine Monitor</h1>

    <div class="card">
        <div class="label">CONVEYOR RUNNING</div>
        <div id="ConveyorRunning">--</div>
    </div>
    <div class="card">
        <div class="label">MOTOR TEMP (F)</div>
        <div id="MotorTemp">--</div>
    </div>
    <div class="card">
        <div class="label">PART COUNT</div>
        <div id="PartCount">--</div>
    </div>

    <h2 style="color:#00d4ff; margin-top:40px;">Last 10 Readings</h2>
    <table id="HistoryTable" style="width:100%; border-collapse:collapse;">
        <thead>
            <tr style="color:#888; text-align:left;">
                <th>Id</th>
                <th>Timestamp</th>
                <th>Running</th>
                <th>Temp</th>
                <th>Parts</th>
            </tr>
        </thead>
        <tbody id="HistoryBody">
        </tbody>
    </table>

    <script>
        const ws = new WebSocket('ws://localhost:8000/ws');

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            document.getElementById('ConveyorRunning').innerText = data.ConveyorRunning;
            document.getElementById('MotorTemp').innerText       = data.MotorTemp;
            document.getElementById('PartCount').innerText       = data.PartCount;
        };

        // Fetch history from database every 5 seconds
        function loadHistory() {
            fetch('/history')
                .then(response => response.json())
                .then(data => {
                    const body = document.getElementById('HistoryBody');
                    body.innerHTML = '';
                    data.forEach(row => {
                        body.innerHTML += `
                            <tr style="border-top: 1px solid #444;">
                                <td>${row.Id}</td>
                                <td>${row.Timestamp}</td>
                                <td>${row.ConveyorRunning}</td>
                                <td>${row.MotorTemp}</td>
                                <td>${row.PartCount}</td>
                            </tr>`;
                    });
                });
        }

        loadHistory();
        setInterval(loadHistory, 5000);
    </script>
</body>
</html>
