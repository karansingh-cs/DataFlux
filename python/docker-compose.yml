services:
  logger:
    build: ./python
    command: python logger.py
    volumes:
      - ./python:/app
    network_mode: host
    restart: unless-stopped

  server:
    build: ./python
    command: python -m uvicorn server:app --host 0.0.0.0 --port 8000
    volumes:
      - ./python:/app
    network_mode: host
    restart: unless-stopped